services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtrack
      POSTGRES_USER: jobtrack
      POSTGRES_PASSWORD: jobtrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      JOBTRACK_DB_URL: jdbc:postgresql://db:5432/jobtrack
      JOBTRACK_DB_USER: jobtrack
      JOBTRACK_DB_PASSWORD: jobtrack
      JOBTRACK_JWT_ISSUER: ${JOBTRACK_JWT_ISSUER:-http://localhost:9000}
    ports:
      - "8080:8080"
